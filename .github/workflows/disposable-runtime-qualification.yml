name: Disposable runtime qualification

# Qualification branch only. No default-branch integration or release action.
on:
  push:
    branches:
      - test/jbod-disposable-runtime-qualification-20261023

permissions:
  contents: read

concurrency:
  group: jbod-disposable-runtime-qualification
  cancel-in-progress: false

jobs:
  matrix:
    if: github.repository == 'gcs8/truenas-jbod-ui' && github.actor == 'gcs8' && github.triggering_actor == 'gcs8'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SOURCE_SHA: e85b8d5b56962bf6bb55d2b1fc1e425c5407dd3b
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out exact accepted source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: e85b8d5b56962bf6bb55d2b1fc1e425c5407dd3b
          persist-credentials: false
          fetch-depth: 1
      - name: Require a fresh job-local Linux Docker host
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          unset DOCKER_CONTEXT DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH BUILDX_BUILDER
          export DOCKER_HOST=unix:///var/run/docker.sock
          test "$(docker --host "$DOCKER_HOST" info --format '{{.Swarm.LocalNodeState}}')" = inactive
          test -z "$(docker --host "$DOCKER_HOST" ps --all --quiet)"
          docker --host "$DOCKER_HOST" compose version
          root="$(mktemp -d "$RUNNER_TEMP/tjui-runtime-XXXXXXXX")"
          chmod 700 "$root"
          printf 'QUALIFICATION_ROOT=%s\n' "$root" >> "$GITHUB_ENV"
          printf 'DOCKER_HOST=unix:///var/run/docker.sock\n' >> "$GITHUB_ENV"
          printf 'TMPDIR=%s\n' "$root" >> "$GITHUB_ENV"
          printf 'DOCKER_CONFIG=%s/docker-config\n' "$root" >> "$GITHUB_ENV"
          mkdir -m 700 "$root/docker-config"
      - name: Build an exact local candidate, never publish it
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH BUILDX_BUILDER
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          docker --host "$DOCKER_HOST" build --build-arg "SOURCE_COMMIT=$SOURCE_SHA" \
            --iidfile "$QUALIFICATION_ROOT/image-id" .
          image="$(<"$QUALIFICATION_ROOT/image-id")"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ ]]
          test "$(docker --host "$DOCKER_HOST" image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          printf 'QUALIFICATION_IMAGE=%s\n' "$image" >> "$GITHUB_ENV"
          printf 'qualification_source=%s image=%s\n' "$SOURCE_SHA" "$image"
      - name: Run all maintained synthetic Compose runtime variants
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_TLS_VERIFY DOCKER_CERT_PATH BUILDX_BUILDER
          timeout --kill-after=30s 1500s python3 scripts/run_compose_runtime_matrix.py \
            --compose docker-compose.yml \
            --config-fixture tests/fixtures/ci-smoke-config.yaml \
            --image "$QUALIFICATION_IMAGE" --source-commit "$SOURCE_SHA" \
            --runtime-root "$QUALIFICATION_ROOT/runtime" --scratch-root "$QUALIFICATION_ROOT" \
            --ui-port 19080 --history-port 19081 --admin-port 19082 \
            --ack I_APPROVE_DISPOSABLE_COMPOSE_QA \
            2>&1 | tee "$QUALIFICATION_ROOT/matrix.log"
          test ! -e "$QUALIFICATION_ROOT/runtime"
          test -z "$(git status --porcelain)"
      - name: Independently read back cleanup, without broad deletion
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          unset DOCKER_CONTEXT DOCKER_HOST DOCKER_TLS_VERIFY DOCKER_CERT_PATH BUILDX_BUILDER
          export DOCKER_HOST=unix:///var/run/docker.sock
          # A query error fails the step. It never counts as resource absence.
          containers="$(timeout 30s docker --host "$DOCKER_HOST" ps --all --format '{{.Names}}')"
          networks="$(timeout 30s docker --host "$DOCKER_HOST" network ls --format '{{.Name}}')"
          volumes="$(timeout 30s docker --host "$DOCKER_HOST" volume ls --format '{{.Name}}')"
          export QUALIFICATION_CONTAINERS="$containers" QUALIFICATION_NETWORKS="$networks" QUALIFICATION_VOLUMES="$volumes"
          python3 - <<'PY'
          import os
          reserved = {'truenas-jbod-ui', 'truenas-jbod-history', 'truenas-jbod-admin'}
          containers = set(os.environ['QUALIFICATION_CONTAINERS'].splitlines())
          assert not containers & reserved, 'reserved QA containers remain'
          for name in ('QUALIFICATION_CONTAINERS', 'QUALIFICATION_NETWORKS', 'QUALIFICATION_VOLUMES'):
              assert not any(value.startswith('tjui-matrix-') for value in os.environ[name].splitlines()), name
          print('qualification_cleanup=pass task_containers=0 task_networks=0 task_volumes=0')
          PY
          # A failed run retains its synthetic scratch in the job log context.
          # The hosted VM is discarded; never prune a daemon or delete by name.
          if [ "${{ job.status }}" = success ]; then
            test -n "${QUALIFICATION_ROOT:-}"
            test ! -e "$QUALIFICATION_ROOT/runtime"
            printf 'qualification_runtime_root=absent\n'
          fi
